name: Deploy EZQRPRINT to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages base path
        env:
          GH_PAGES_BASE_PATH: ${{ vars.GH_PAGES_BASE_PATH }}
        run: |
          if [[ -z "$GH_PAGES_BASE_PATH" ]]; then
            GH_PAGES_BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "VITE_BASE_PATH=$GH_PAGES_BASE_PATH" >> "$GITHUB_ENV"

      - name: Build EZQRPRINT
        env:
          VITE_UPI_ID: ${{ secrets.VITE_UPI_ID }}
          VITE_UPI_PAYEE_NAME: ${{ secrets.VITE_UPI_PAYEE_NAME }}
        run: |
          if [[ -z "$VITE_UPI_ID" || -z "$VITE_UPI_PAYEE_NAME" ]]; then
            echo "::error::Set VITE_UPI_ID and VITE_UPI_PAYEE_NAME repository secrets before deploying."
            exit 1
          fi
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
